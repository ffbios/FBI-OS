name: Deploy website to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Build the static site
        run: |
          mkdir -p _site
          # Public pages only. The Admin Hub needs a server, so it stays on Railway.
          cp -a public/. _site/
          rm -rf _site/admin
          mkdir -p _site/admin
          cat > _site/admin/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <title>FBI Admin Hub</title>
          <meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0; url=https://fbi-gh-website-production.up.railway.app/admin/">
          <link rel="canonical" href="https://fbi-gh-website-production.up.railway.app/admin/">
          </head><body><p>The Admin Hub has moved to <a href="https://fbi-gh-website-production.up.railway.app/admin/">the FBI Admin Hub</a>.</p></body></html>
          HTML
          echo "fbigh.com" > _site/CNAME
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
